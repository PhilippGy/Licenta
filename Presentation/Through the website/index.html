<!DOCTYPE html>
<html lang="ro">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chatbot Admitere FMI UBB</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .container {
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            max-width: 650px;
            width: 100%;
        }

        h1 {
            color: #2c3e50;
            text-align: center;
            font-size: 1.6rem;
        }

        .description {
            text-align: center;
            color: #7f8c8d;
            font-size: 0.9rem;
            margin-bottom: 20px;
        }

        textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            resize: vertical;
            min-height: 80px;
            font-family: inherit;
            margin-bottom: 15px;
            box-sizing: border-box;
            font-size: 1rem;
        }

        button {
            background-color: #2980b9;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 1rem;
            font-weight: bold;
            width: 100%;
            transition: background 0.3s;
        }

        button:hover {
            background-color: #1f6391;
        }

        button:disabled {
            background-color: #95a5a6;
            cursor: not-allowed;
        }

        .loader {
            display: none;
            text-align: center;
            margin-top: 15px;
            font-style: italic;
            color: #7f8c8d;
        }

        .result-box {
            margin-top: 20px;
            padding: 15px;
            border-radius: 6px;
            display: none;
            line-height: 1.5;
        }

        .answer-box {
            background-color: #e8f4f8;
            border-left: 5px solid #3498db;
        }

        .score-box {
            background-color: #fef9e7;
            border-left: 5px solid #f1c40f;
            margin-top: 15px;
            font-size: 0.95em;
        }

        h3 {
            margin-top: 0;
            margin-bottom: 10px;
            font-size: 1.1rem;
            color: #2c3e50;
        }

        .content-text {
            white-space: pre-wrap;
            color: #34495e;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>Admitere FMI UBB Cluj</h1>
        <div class="description">Chatbot RAG cu asistent de evaluare (LLM-as-a-Judge)</div>

        <textarea id="questionInput" placeholder="Ex: Care sunt actele necesare pentru dosarul de admitere?"></textarea>
        <button id="submitBtn" onclick="askQuestion()">Întreabă</button>
        <div class="loader" id="loader">Procesez răspunsul... Modelele locale generează rezultatul.</div>

        <div class="result-box answer-box" id="answerContainer">
            <h3>Răspuns RAG:</h3>
            <div class="content-text" id="answerText"></div>
        </div>

        <div class="result-box score-box" id="scoreContainer">
            <h3>Evaluare (Judge Model):</h3>
            <div class="content-text" id="scoreText"></div>
        </div>
    </div>

    <script>
        async function askQuestion() {
            const question = document.getElementById('questionInput').value.trim();
            if (!question) return;

            const btn = document.getElementById('submitBtn');
            const loader = document.getElementById('loader');
            const answerContainer = document.getElementById('answerContainer');
            const scoreContainer = document.getElementById('scoreContainer');

            // Resetăm UI-ul pentru request-ul curent
            btn.disabled = true;
            loader.style.display = 'block';
            answerContainer.style.display = 'none';
            scoreContainer.style.display = 'none';

            try {
                // Deoarece frontend-ul este servit de pe același server (FastAPI), 
                // folosim calea relativă '/ask'. Acest lucru este perfect pentru ngrok.
                const response = await fetch('/ask', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ question: question })
                });

                const data = await response.json();

                if (response.ok) {
                    document.getElementById('answerText').textContent = data.answer;
                    document.getElementById('scoreText').textContent = data.score;
                    answerContainer.style.display = 'block';
                    scoreContainer.style.display = 'block';
                } else {
                    alert('Eroare: ' + (data.detail || 'Eroare internă server.'));
                }
            } catch (error) {
                alert('Eroare de rețea. Verifică consola pentru detalii.');
                console.error('Error:', error);
            } finally {
                btn.disabled = false;
                loader.style.display = 'none';
            }
        }
    </script>
</body>

</html>
